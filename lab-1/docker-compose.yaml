services:
  app:
    build:
      context: ..
      dockerfile: lab-1/Dockerfile
    restart: unless-stopped
    environment:
      - ENV=${ENV:-dev}
      - PORT=8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    ports:
      - "127.0.0.1:8080:8080"
